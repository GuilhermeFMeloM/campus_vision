image: google/cloud-sdk:latest

pipelines:
  branches:
    main:
      - step:
          name: Build e Deploy no Cloud Run
          services:
            - docker
          script:
            # 1. Salvar chave principal e autenticar na GCP
            - echo "$GCP_SA_KEY" > /tmp/key.json
            - gcloud auth activate-service-account --key-file=/tmp/key.json
            - gcloud config set project $GCP_PROJECT_ID
            - export REGION="${GCP_REGION:-us-central1}"
            - gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

            # 2. Construir e enviar a imagem para o Artifact Registry
            - export IMAGE="${REGION}-docker.pkg.dev/$GCP_PROJECT_ID/campusvision-repo/campusvision:$BITBUCKET_COMMIT"
            - docker build -t $IMAGE .
            - docker push $IMAGE

            # 3. Deploy limpo no Cloud Run
            - gcloud run deploy campusvision --image=$IMAGE --region=$REGION --port=8080 --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3 --allow-unauthenticated --set-env-vars=GCP_PROJECT=$GCP_PROJECT_ID,DJANGO_DEBUG=False --quiet
