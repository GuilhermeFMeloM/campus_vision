# =========================================================================
# Bitbucket Pipelines - CI/CD Automatizado para o Google Cloud Run
# =========================================================================
image: google/cloud-sdk:alpine

pipelines:
  branches:
    main:
      - step:
          name: Deploy para Google Cloud Run
          deployment: production
          services:
            - docker
          script:
            # 1. Autenticação com a Chave da Service Account do GCP
            - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
            - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
            - gcloud config set project $GCP_PROJECT_ID

            # 2. Configura autenticação do Docker com o Artifact Registry
            - gcloud auth configure-docker ${GCP_REGION}-docker.pkg.dev --quiet
            - export IMAGE_NAME="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/campusvision-repo/campusvision:${BITBUCKET_COMMIT}"

            # 3. Build e envio da imagem Docker
            - docker build -t $IMAGE_NAME .
            - docker push $IMAGE_NAME

            # 4. Deploy no Cloud Run
            - gcloud run deploy campusvision \
                --image $IMAGE_NAME \
                --region $GCP_REGION \
                --platform managed \
                --allow-unauthenticated \
                --port 8080 \
                --memory 512Mi \
                --cpu 1 \
                --set-env-vars DJANGO_DEBUG=False
