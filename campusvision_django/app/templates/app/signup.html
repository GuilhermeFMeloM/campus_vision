{% extends "app/base.html" %}
{% load static %}

{% block content %}
<link href="{% static 'login.css' %}" rel="stylesheet">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="text-center mb-4">Add User</h3>
            <div class="card">
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                    <div class="wrapper">
                        <div class="form-content">
                            <form method="POST" action="{% url 'signup' %}">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email address</label>
                                    <input id="email" class="form-control" type="email" name="email" placeholder="Email" autofocus="">
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name</label>
                                    <input id="name" class="form-control" type="text" name="name" placeholder="Name" autofocus="">
                                </div>
                                <div class="mb-3">
                                    <label for="pass" class="form-label">Password</label>
                                    <input id="pass" class="form-control" type="password" name="password" placeholder="Password">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" name="is_admin" value="1" id="isAdmin">
                                    <label class="form-check-label" for="isAdmin">Admin</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Add User</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
