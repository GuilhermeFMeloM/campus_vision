{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>CampusVision Vídeo - {{ title }}</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <link rel="stylesheet" href="{% static 'feed.css' %}">
  </head>
  <body style="background-color: #000; overflow: hidden;">
    <div class="d-flex align-items-center justify-content-center" style="width: 100vw; height: 100vh;">
        {% if video %}
        <video id="singleVideoPlayer" style="width: 100%; height: 100%; object-fit: contain;" autoplay loop muted playsinline preload="auto">
          <source src="{% static 'uploads/' %}{{ video }}" type="video/mp4"/>
          <source src="/media/{{ video }}" type="video/mp4"/>
          Seu navegador não suporta a tag de vídeo.
        </video>
        {% else %}
        <div class="text-center text-white">
          <h2>Nenhum vídeo em exibição no momento para este feed.</h2>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const vid = document.getElementById('singleVideoPlayer');
      if (vid) {
        vid.muted = true;
        vid.play().catch(e => console.warn('Autoplay bloqueado:', e));
      }
    </script>
  </body>
</html>
