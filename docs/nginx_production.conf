# Configuração Otimizada Nginx para Campus Vision (GCP Free Tier)
# Local no servidor: /etc/nginx/sites-available/campusvision

server {
    listen 80;
    server_name 35.243.187.172; # Substitua pelo seu IP ou domínio

    client_max_body_size 50M;

    # 1. Cache Agressivo de Arquivos de Mídia (Vídeos e Imagens)
    # Evita que as TVs baixem o mesmo vídeo repetidamente, reduzindo o tráfego a zero
    location /static/uploads/ {
        alias /var/www/campus_vision/campusvision_django/app/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 2. Arquivos Estáticos Gerais (CSS, JS, Fontes, Ícones)
    location /static/ {
        alias /var/www/campus_vision/campusvision_django/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 3. Encaminhamento para a aplicação Django / Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Compressão Gzip para reduzir tamanho de requisições de texto e JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
